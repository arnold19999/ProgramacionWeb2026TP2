<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Rendimiento Escolar</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="contenedor">
    <header class="encabezado no-print">
      <div>

        <h1>Dashboard de Rendimiento Escolar</h1>
      </div>
      <button id="btnImprimir" class="btn">Imprimir / PDF</button>
    </header>

    <section id="dashboard" class="dashboard">
      <div class="panel-titulo">
        <h2>Resumen general</h2>
        <p>Análisis dinámico de notas de alumnos</p>
      </div>

      <div class="resumen">
        <div class="card">
          <h3>Promedio</h3>
          <p id="promedio">0</p>
        </div>
        <div class="card">
          <h3>Mejor alumno</h3>
          <p id="mejorAlumno">-</p>
        </div>
        <div class="card">
          <h3>Peor alumno</h3>
          <p id="peorAlumno">-</p>
        </div>
      </div>

      <div class="grid-dashboard">
        <div class="panel">
          <h3>Lista de alumnos</h3>
          <div id="listaAlumnos" class="lista-alumnos"></div>
        </div>

        <div class="panel">
          <h3>Gráfico de notas</h3>
          <div id="grafico" class="grafico"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
