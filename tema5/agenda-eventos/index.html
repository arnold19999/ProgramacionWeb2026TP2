<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Eventos Inteligente</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <div>
        <h1>Agenda de Eventos Inteligente</h1>
      </div>
    </header>

    <section class="panel">
      <h2>Formulario de eventos</h2>
      <form id="formEvento" class="formulario">
        <input type="hidden" id="eventoId">

        <div class="campo">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ej.: Reunión de proyecto">
        </div>

        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha">
        </div>

        <div class="campo campo-completo">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" rows="4" placeholder="Detalle del evento"></textarea>
        </div>

        <div class="acciones-formulario">
          <button type="submit" class="btn btn-principal" id="btnGuardar">Guardar evento</button>
          <button type="button" class="btn btn-secundario oculto" id="btnCancelar">Cancelar edición</button>
        </div>
      </form>
    </section>

    <section class="panel filtros">
      <h2>Filtros por fecha</h2>
      <div class="grid-filtros">
        <div class="campo">
          <label for="filtroDesde">Desde</label>
          <input type="date" id="filtroDesde">
        </div>

        <div class="campo">
          <label for="filtroHasta">Hasta</label>
          <input type="date" id="filtroHasta">
        </div>

        <div class="campo campo-botonera">
          <label>&nbsp;</label>
          <div class="botonera-filtros">
            <button type="button" class="btn btn-principal" id="btnFiltrar">Aplicar filtro</button>
            <button type="button" class="btn btn-secundario" id="btnLimpiarFiltros">Limpiar</button>
            <button type="button" class="btn btn-pdf" id="btnPdf">Exportar PDF</button>
          </div>
        </div>
      </div>
      <p class="ayuda">Para exportar la agenda diaria, seleccioná una sola fecha en “Desde” o la misma fecha en “Desde” y “Hasta”.</p>
    </section>

    <section class="panel resumen">
      <div class="tarjeta-resumen">
        <span>Total de eventos</span>
        <strong id="totalEventos">0</strong>
      </div>
      <div class="tarjeta-resumen">
        <span>Eventos filtrados</span>
        <strong id="eventosFiltrados">0</strong>
      </div>
    </section>

    <section class="panel">
      <div class="cabecera-lista">
        <h2>Lista de eventos</h2>
      </div>
      <div id="listaEventos" class="lista-eventos"></div>
      <p id="sinEventos" class="sin-eventos">No hay eventos registrados.</p>
    </section>
  </main>

  <section id="areaImpresion" class="area-impresion">
    <div class="hoja-pdf">
      <h2>Agenda diaria de eventos</h2>
      <p id="fechaAgendaPdf"></p>
      <div id="listaPdf"></div>
    </div>
  </section>

  <script src="js/app.js"></script>
</body>
</html>
