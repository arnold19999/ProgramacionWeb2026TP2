<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="contenedor">
    <header class="encabezado">
      <div>

        <h1>Carrito de Compras</h1>
        <p class="subtexto">Realiza tus compras.</p>
      </div>
      <div class="acciones-superiores">
        <button id="btnVaciar" class="btn btn-secundario" type="button">Vaciar carrito</button>
        <button id="btnImprimir" class="btn" type="button">Imprimir comprobante</button>
      </div>
    </header>

    <main class="panel-principal">
      <section class="productos-panel">
        <div class="barra-panel">
          <h2>Productos</h2>
          <input type="text" id="buscador" placeholder="Filtrar productos por nombre">
        </div>
        <div id="listaProductos" class="grid-productos"></div>
      </section>

      <aside class="carrito-panel">
        <div class="carrito-header">
          <h2>Carrito</h2>
          <span id="cantidadItems" class="badge">0 items</span>
        </div>

        <div id="listaCarrito" class="lista-carrito"></div>

        <div class="resumen">
          <div class="linea-resumen">
            <span>Total acumulado</span>
            <strong id="totalCarrito">Gs. 0</strong>
          </div>
        </div>
      </aside>
    </main>

    <section id="comprobante" class="comprobante" style="visibility: hidden;">
      <div class="comprobante-cabecera">
        <div>
          <h2>Comprobante de compra</h2>
          <p>Tienda Tech Store</p>
        </div>
        <div class="datos-comprobante">
          <p><strong>Fecha:</strong> <span id="fechaComprobante"></span></p>
          <p><strong>N°:</strong> <span id="numeroComprobante"></span></p>
        </div>
      </div>

      <table class="tabla-comprobante">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="detalleComprobante"></tbody>
      </table>

      <div class="pie-comprobante">
        <p><strong>Total:</strong> <span id="totalComprobante">Gs. 0</span></p>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
